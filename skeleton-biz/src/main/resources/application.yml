server:
  port: 8080
  servlet:
    session:
      # 会话 30 分钟无操作失效
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        # 前后端不同端口时携带 Cookie（Cross-Origin 需要 SameSite=None + secure）
        same-site: lax

spring:
  # mysql连接
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/boot-skeleton?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 021202zly
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
  # Spring Session：会话持久化到 Redis
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: skeleton:session
      flush-mode: on_save
      # indexed 启用 principalName 索引，SpringSessionBackedSessionRegistry 依赖它
      repository-type: indexed
  redis:
    Redisson:
      config: |
        singleServerConfig:
          idleConnectionTimeout: 10000
          connectTimeout: 10000
          timeout: 3000
          retryAttempts: 3
          retryInterval: 1500
          password:
          subscriptionsPerConnection: 5
          clientName: null
          address: "redis://127.0.0.1:6379"
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
          connectionMinimumIdleSize: 24
          connectionPoolSize: 64
          database: 0
          dnsMonitoringInterval: 5000
        threads: 16
        nettyThreads: 32
        codec: !<org.redisson.client.codec.StringCodec> {}
        transportMode: "NIO"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto